[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "stkt"
version = "1.0.0"
description = "Stkt (Stackt) Programming Language Compiler"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
    { name = "Ben Promkaew", email = "ben.promkaew@icloud.com" }
]
maintainers = [
    { name = "Ben Promkaew", email = "ben.promkaew@icloud.com" }
]

dependencies = [
    "ply>=3.11",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.scripts]
stkt = "stkt:main"
stktc = "stkt:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
